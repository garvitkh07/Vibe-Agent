[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-agent"
version = "0.1.0"
description = "Vibe — a local-first AI developer agent with a swappable LLM brain (Ollama default), 19 built-in tools, and a safety/confirmation layer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "you" }]
keywords = ["ai", "agent", "llm", "ollama", "coding", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

# Zero runtime dependencies by design — standard library only.
dependencies = []

[project.scripts]
vibe = "vibe_agent.cli:main"

[project.urls]
Homepage = "https://github.com/your-name/vibe-agent"

[tool.setuptools.packages.find]
include = ["vibe_agent*"]
